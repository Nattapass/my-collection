<div class="app-shell" [class.motion-off]="!motion.enabled()" [class.signed-in]="authService.isAuthenticated()">
  @if (authService.isAuthenticated()) {
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <nav class="navigation" aria-label="Main navigation" (keydown.escape)="menuOpen.set(false); menuToggle.focus()">
        <a class="wordmark" routerLink="/dashboard" aria-label="My Collection home" (click)="menuOpen.set(false)">mc<span>.</span></a>
        <button #menuToggle class="menu-toggle" type="button" aria-controls="primary-menu"
          [attr.aria-expanded]="menuOpen()" (click)="menuOpen.set(!menuOpen())">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            @if (menuOpen()) {
              <path d="m6 6 12 12M6 18 18 6" />
            } @else {
              <path d="M4 7h16M4 12h16M4 17h16" />
            }
          </svg>
          {{ menuOpen() ? 'Close' : 'Menu' }}
        </button>
        <div id="primary-menu" class="nav-links" [class.is-open]="menuOpen()">
          @for (item of navigation; track item.path) {
            <a [routerLink]="item.path" [class.active]="isActive(item)"
              [attr.aria-current]="isActive(item) ? 'page' : null" (click)="menuOpen.set(false)">{{ item.label }}</a>
          }
        </div>
        <button class="logout" type="button" (click)="logout()">
          Logout
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M9 4H4v16h5M10 12h10m-4-4 4 4-4 4" />
          </svg>
        </button>
      </nav>
    </header>
  }
  @if (authService.isAuthenticated()) { <div class="motion-preference"><button type="button" [attr.aria-pressed]="motion.enabled()" (click)="motion.enabled.set(!motion.enabled())">{{ motion.enabled() ? 'Motion: On' : 'Motion: Off' }}</button></div> }
  <main id="main-content" tabindex="-1" class="page-content">
    <router-outlet />
  </main>
</div>
